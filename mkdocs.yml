site_name: "Digital Waste Tracking: Software Developer Guide"
site_url: https://defra.github.io/waste-tracking-service
repo_url: https://github.com/DEFRA/waste-tracking-service
remote_branch: gh-pages
theme:
  name: material
  custom_dir: tech_docs_template
  logo: logos/moj.png
  favicon: favicons/moj.ico
  features:
    - announce.dismiss  
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.share
    #- content.action.edit
    - content.action.view
    - toc.integrate
    # uncomment to merge TOC with navigation bar
  announce: >
    **Private Beta service has ended, the service is now in Public Beta**
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    admonition:
      quote: octicons/quote-16
    tag:
      draft: material/sticker-outline
      accepted: material/sticker-check-outline
      proposed: material/sticker-plus-outline
      deprecated: material/sticker-minus-outline
      superseded: material/sticker-alert-outline
      rejected: material/sticker-remove-outline
  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Receipt of Waste:
    - API October Reporting Deadlines: api-reporting-deadlines.md
    - Register as a software provider: README.md
    - Receipt of Waste Data Definitions: api-receipt-data-definitions.md
    - API Getting Started Guide: api-receipt-of-waste-getting-started-guide.md
    - API authentication guide: api-authentication-guide.md
    - API codes for testing and production: api-codes-for-testing-and-production.md
    - API Production Approval Tests (PAT): api-production-approval-tests.md
    - API testing and examples: api-testing-and-examples.md
    - API terms of service: api-terms-of-service.md
    - FAQ: faq.md
  - API:
    - Receipt API Specification: api-specification-receipt.md
    #- Collections API Specification: api-specification-collections.md
extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/swagger-ui-dist/swagger-ui.css
extra_javascript:
  - swagger-initializer.js
  - https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js
  - https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js
edit_uri: edit/main/docs/
plugins:
  - material/search
  #- git-revision-date-localized
#      type: custom
 #     custom_format: "%d %B %Y"
  #- document-dates:
   #   type: date
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.magiclink
  - tables
  - attr_list
  - toc:
      toc_depth: 1
extra:
  version:
    provider: mike
    default: production
  social:
    - icon: fontawesome/solid/paper-plane 
      link: mailto:wasteuserresearch@defra.gov.uk
      name: "Contact us here"
    - icon: fontawesome/brands/github
      link: https://github.com/defra/waste-tracking-service
      name: "Our DWT service is available here"
  tags:
    Draft: draft
    Accepted: accepted
    Proposed: proposed
    Superseded: superseded
    Deprecated: deprecated
    Rejected: rejected
#  analytics:
#    provider: google

#    property: G-SKK1DY4NVV


