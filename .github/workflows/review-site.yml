name: Publish Review Site

on:
  push:
    branches: 
      - DWTA-311_restructure_revew

permissions:
  contents: write

jobs:
  deploy-review-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          pip install mkdocs
          pip install mkdocs-material

      - name: Build MkDocs site
        run: |
          mkdocs build

      - name: Deploy review site
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: review-oct2026
          keep_files: true
